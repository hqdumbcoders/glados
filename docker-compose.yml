services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: glados_user
      POSTGRES_PASSWORD: glados_password
      POSTGRES_DB: glados_test_db
    ports:
      - "5433:5432"

  web:
    build: .

    ports:

      - "8000:8000"
    
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db

volumes:
  postgres_data: